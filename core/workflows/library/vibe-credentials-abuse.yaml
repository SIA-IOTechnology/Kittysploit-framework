id: vibe-credentials-abuse
version: "1"
name: Vibe Stack Credential Abuse (Intrusive)
description: >
  Follow-up exploitation chain for vibe-coded apps after vibe-stack-audit findings.
  Uses leaked keys/tokens to enumerate Supabase, Clerk/Auth0, GitHub/GitLab, BaaS DBs,
  email (Resend), payments (Stripe webhooks), CMS users, realtime channels, and LLM observability.
  INTRUSIVE — may send OTP/magic-link probes and signed webhook test events. Authorized targets only.
tags: [vibe, nocode, credentials, abuse, enumeration, intrusive]
policy:
  safe_only: false
continue_on_failure: true
variables:
  target:
    description: Target hostname or URL (for auto-discover from bundles)
    required: true
  port: "443"
  ssl: "true"
start_step: supabase_enum
steps:
  supabase_enum:
    module: auxiliary/scanner/http/supabase_api_enum
    description: Supabase PostgREST, storage, and auth user enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: supabase_otp
    on_failure: supabase_otp
  supabase_otp:
    module: auxiliary/scanner/http/supabase_otp_abuse
    description: Supabase OTP / magic-link endpoint probe
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: clerk_auth0
    on_failure: clerk_auth0
  clerk_auth0:
    module: auxiliary/scanner/http/clerk_auth0_management_enum
    description: Clerk / Auth0 Management API user enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: clerk_passwordless
    on_failure: clerk_passwordless
  clerk_passwordless:
    module: auxiliary/scanner/http/clerk_passwordless_enum
    description: Clerk passwordless sign-in probe
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: auth0_passwordless
    on_failure: auth0_passwordless
  auth0_passwordless:
    module: auxiliary/scanner/http/auth0_passwordless_enum
    description: Auth0 passwordless email link probe
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: turso_upstash
    on_failure: turso_upstash
  turso_upstash:
    module: auxiliary/scanner/http/turso_upstash_enum
    description: Turso / Upstash Redis API enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: neon_db
    on_failure: neon_db
  neon_db:
    module: auxiliary/scanner/http/neon_database_enum
    description: Neon DATABASE_URL and Management API validation
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: planetscale
    on_failure: planetscale
  planetscale:
    module: auxiliary/scanner/http/planetscale_branch_enum
    description: PlanetScale org/database/branch enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: convex_deploy
    on_failure: convex_deploy
  convex_deploy:
    module: auxiliary/scanner/http/convex_deploy_key_enum
    description: Convex deploy key and deployment API
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: appwrite_users
    on_failure: appwrite_users
  appwrite_users:
    module: auxiliary/scanner/http/appwrite_users_enum
    description: Appwrite users and teams enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: pocketbase_admin
    on_failure: pocketbase_admin
  pocketbase_admin:
    module: auxiliary/scanner/http/pocketbase_admin_enum
    description: PocketBase admin and collections enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: contentful
    on_failure: contentful
  contentful:
    module: auxiliary/scanner/http/contentful_management_enum
    description: Contentful Management API enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: sanity_directus
    on_failure: sanity_directus
  sanity_directus:
    module: auxiliary/scanner/http/sanity_directus_token_abuse
    description: Sanity GROQ and Directus user enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: strapi_users
    on_failure: strapi_users
  strapi_users:
    module: auxiliary/scanner/http/strapi_users_enum
    description: Strapi REST users enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
    on_success: strapi_graphql
    on_failure: strapi_graphql
  strapi_graphql:
    module: auxiliary/scanner/http/strapi_graphql_abuse
    description: Strapi GraphQL users enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
    on_success: payloadcms_api
    on_failure: payloadcms_api
  payloadcms_api:
    module: auxiliary/scanner/http/payloadcms_api_enum
    description: Payload CMS API users enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
    on_success: posthog_pii
    on_failure: posthog_pii
  posthog_pii:
    module: auxiliary/scanner/http/posthog_analytics_pii_enum
    description: PostHog events and PII enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: langsmith_langfuse
    on_failure: langsmith_langfuse
  langsmith_langfuse:
    module: auxiliary/scanner/http/langsmith_langfuse_key_abuse
    description: LangSmith / Langfuse trace enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: pusher_liveblocks
    on_failure: pusher_liveblocks
  pusher_liveblocks:
    module: auxiliary/scanner/http/pusher_liveblocks_channel_enum
    description: Pusher / Liveblocks channel enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: resend_email
    on_failure: resend_email
  resend_email:
    module: auxiliary/scanner/http/resend_email_enum
    description: Resend domains and sent emails enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: uploadthing
    on_failure: uploadthing
  uploadthing:
    module: auxiliary/scanner/http/uploadthing_abuse
    description: UploadThing file listing
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: stripe_webhook
    on_failure: stripe_webhook
  stripe_webhook:
    module: auxiliary/scanner/http/stripe_webhook_abuse
    description: Stripe whsec validation and webhook probe
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: github_pat
    on_failure: github_pat
  github_pat:
    module: auxiliary/scanner/http/github_pat_repo_enum
    description: GitHub PAT repo and org enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: gitlab_token
    on_failure: gitlab_token
  gitlab_token:
    module: auxiliary/scanner/http/gitlab_api_token_abuse
    description: GitLab API token project enum
    options:
      target: "${target}"
      port: "${port}"
      ssl: "${ssl}"
      auto_discover: "true"
    on_success: null
    on_failure: null
