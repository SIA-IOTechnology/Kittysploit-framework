<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KittySploit | Editor</title>
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script>
        window.KITTYCOLLAB_SERVER_URL = "{{ server_url|default('') }}";
        const SERVER_TOKEN = "{{ api_token|default('') }}";
        const TOKEN_VALUE = SERVER_TOKEN.trim();
        if (TOKEN_VALUE) {
            sessionStorage.setItem('token', TOKEN_VALUE);
        }
    </script>
</head>

<body>
    <div class="app-shell editor-shell">
        <aside class="nav-sidebar">
            <div class="nav-brand">
                <img src="/static/img/logo.png" alt="KittySploit" onerror="this.style.display='none'">
            </div>
            <nav class="nav-menu">
                <a class="nav-item" href="/rooms" title="Sessions">
                    <i class="fas fa-layer-group"></i>
                </a>
                <a class="nav-item active" href="/editor" title="Editor">
                    <i class="fas fa-code"></i>
                </a>
            </nav>
            <div class="nav-footer">
                <button class="nav-item" type="button" onclick="window.location.href='/rooms'" title="Back to sessions">
                    <i class="fas fa-arrow-left"></i>
                </button>
            </div>
        </aside>

        <div class="shell-main">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="breadcrumb">
                        <span>Sessions</span>
                        <span class="sep">/</span>
                        <strong id="topbarRoomId">Editor</strong>
                    </div>
                </div>
                <div class="topbar-center">
                    <span class="status-pill" id="connectionPill"><span class="dot"></span> Connected</span>
                    <span class="status-pill" id="saveStatusPill" style="display:none;"></span>
                </div>
                <div class="topbar-right">
                    <div class="user-chip">
                        <span class="name" id="topbarUser">User</span>
                        <div class="user-avatar" id="topbarAvatar">U</div>
                    </div>
                </div>
            </header>

            <div class="workspace">
                <div class="app-container" style="height:100%;flex:1;">
                    <div class="sidebar">
                        <div class="sidebar-header">
                            <div class="room-info" id="roomInfo">#Loading…</div>
                            <button class="icon-btn" id="editDescriptionBtn" onclick="editRoomDescription()" title="Edit description">
                                <i class="fas fa-edit" style="font-size:12px;"></i>
                            </button>
                            <button class="icon-btn" id="deleteRoomBtn" onclick="deleteCurrentRoom()" title="Delete session" style="display:none;color:var(--error);">
                                <i class="fas fa-trash" style="font-size:12px;"></i>
                            </button>
                        </div>

                        <div class="room-description-container" id="roomDescriptionContainer" style="display:none;">
                            <div class="room-description-text" id="roomDescriptionText"></div>
                        </div>

                        <div class="sidebar-tabs">
                            <button class="sidebar-tab active" onclick="switchTab('modules', {currentTarget: this})" title="Modules">
                                <i class="fas fa-cubes"></i>
                            </button>
                            <button class="sidebar-tab" onclick="switchTab('files', {currentTarget: this})" title="Files">
                                <i class="fas fa-folder-open"></i>
                            </button>
                            <button class="sidebar-tab" onclick="switchTab('chat', {currentTarget: this})" title="Chat">
                                <i class="fas fa-comments"></i>
                            </button>
                            <button class="sidebar-tab" onclick="switchTab('notes', {currentTarget: this})" title="Notes">
                                <i class="fas fa-sticky-note"></i>
                            </button>
                        </div>

                        <div class="sidebar-content-area">
                            <div class="sidebar-view active" id="tab-modules">
                                <div class="section-title">Local modules</div>
                                <ul class="list-container" id="moduleList">
                                    <li class="loading-item"><i class="fas fa-circle-notch fa-spin"></i> Loading modules…</li>
                                </ul>
                            </div>

                            <div class="sidebar-view" id="tab-files">
                                <div class="section-title">Project files</div>
                                <div class="upload-zone">
                                    <button class="action-btn small" onclick="createNewPythonFile()">
                                        <i class="fas fa-plus"></i> New Python file
                                    </button>
                                    <label for="fileUpload" class="upload-btn">
                                        <i class="fas fa-cloud-upload-alt"></i> Upload file
                                    </label>
                                    <input type="file" id="fileUpload" multiple>
                                </div>
                                <ul class="list-container" id="filesList"></ul>
                            </div>

                            <div class="sidebar-view" id="tab-chat">
                                <div class="chat-container">
                                    <div class="chat-messages" id="chatMessages"></div>
                                    <div class="chat-input-area">
                                        <input type="text" id="chatInput" placeholder="Write a message…"
                                            onkeypress="if(event.key==='Enter') sendChatMessage()">
                                        <button type="button" onclick="sendChatMessage()"><i class="fas fa-paper-plane"></i></button>
                                    </div>
                                </div>
                            </div>

                            <div class="sidebar-view" id="tab-notes">
                                <div class="section-title">Notes</div>
                                <button class="action-btn small" onclick="createNote()">
                                    <i class="fas fa-plus"></i> New note
                                </button>
                                <ul class="list-container" id="notesList"></ul>
                            </div>
                        </div>

                        <div class="sidebar-footer">
                            <div class="user-info">
                                <div class="status-dot online"></div>
                                <span id="currentUser">User</span>
                            </div>
                            <button class="icon-btn" onclick="window.location.href='/rooms'" title="Exit session">
                                <i class="fas fa-sign-out-alt"></i>
                            </button>
                        </div>
                    </div>

                    <div class="resizer" id="sidebarResizer"></div>

                    <div class="main-content">
                        <div class="editor-toolbar">
                            <div class="file-info">
                                <i class="fas fa-file-code"></i>
                                <span id="editorTitle">No file selected</span>
                            </div>
                            <div class="toolbar-actions">
                                <span id="saveStatus" class="save-status"></span>
                                <button class="action-btn" id="copyBtn" disabled>
                                    <i class="fas fa-copy"></i> Copy
                                </button>
                                <button class="action-btn" id="shareBtn" disabled>
                                    <i class="fas fa-share-alt"></i> Share
                                </button>
                                <button class="action-btn primary" id="saveBtn" disabled>
                                    <i class="fas fa-save"></i> Save
                                </button>
                            </div>
                        </div>

                        <div class="editor-area">
                            <div id="editor"></div>
                            <div id="imagePreview" style="display:none;width:100%;height:100%;overflow:auto;background:#1e1e1e;padding:20px;box-sizing:border-box;">
                                <img id="previewImage" src="" alt="Image preview" style="max-width:100%;max-height:100%;display:block;margin:0 auto;">
                            </div>
                            <div class="empty-editor-state" id="editorLoading">
                                <i class="fas fa-code"></i>
                                <p>Select a module or file to begin editing</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="noteModal" onclick="if(event.target === this) closeNoteModal()">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Note</h3>
                <button class="icon-btn" type="button" onclick="closeNoteModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="noteTitle" placeholder="Enter note title…">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="noteContent" rows="10" placeholder="Enter note description…"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" type="button" onclick="closeNoteModal()">Cancel</button>
                <button class="btn-primary" type="button" id="saveNoteBtn" onclick="saveNote()" style="width:auto;">Save</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="descriptionModal" onclick="if(event.target === this) closeDescriptionModal()">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Edit session description</h3>
                <button class="icon-btn" type="button" onclick="closeDescriptionModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="roomDescription" rows="4" placeholder="Enter session description…"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" type="button" onclick="closeDescriptionModal()">Cancel</button>
                <button class="btn-primary" type="button" onclick="saveRoomDescription()" style="width:auto;">Save</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        (function syncTopbar() {
            function refresh() {
                const user = sessionStorage.getItem('username') || 'User';
                const room = sessionStorage.getItem('currentRoomId') || '';
                const userEl = document.getElementById('topbarUser');
                const avatarEl = document.getElementById('topbarAvatar');
                const roomEl = document.getElementById('topbarRoomId');
                const roomInfo = document.getElementById('roomInfo');
                if (userEl) userEl.textContent = user;
                if (avatarEl) avatarEl.textContent = user.charAt(0).toUpperCase();
                if (roomEl && room) roomEl.textContent = '#' + room;
                if (roomInfo && room && roomInfo.textContent.indexOf('Loading') !== -1) {
                    roomInfo.textContent = '#' + room;
                }
            }
            refresh();
            setInterval(refresh, 1500);
        })();
    </script>
</body>

</html>
