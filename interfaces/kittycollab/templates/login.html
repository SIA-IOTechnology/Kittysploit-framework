<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KittySploit | KittyCollab</title>
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="page-login">
    <div class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <img src="/static/img/logo.png" alt="KittySploit" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <i class="fas fa-shield-cat" style="display:none;font-size:48px;color:var(--accent);margin-bottom:14px;"></i>
                <h1>KittySploit</h1>
                <p>Collaborative sessions workspace</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Display name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Enter your name" required autocomplete="off" autofocus>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Continue to sessions</button>
            </form>
        </div>
    </div>

    <script>
        window.KITTYCOLLAB_SERVER_URL = "{{ server_url|default('') }}";
        const SERVER_URL = window.KITTYCOLLAB_SERVER_URL || window.location.origin;

        const SERVER_TOKEN = {% if api_token %}'{{ api_token }}'{% else %}null{% endif %};
        if (SERVER_TOKEN) {
            sessionStorage.setItem('token', SERVER_TOKEN);
        } else {
            sessionStorage.removeItem('token');
        }

        document.getElementById('loginForm').onsubmit = async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            if (!username) return;

            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Opening…';
            btn.disabled = true;

            try {
                sessionStorage.setItem('username', username);
                if (window.KITTYCOLLAB_SERVER_URL) {
                    sessionStorage.setItem('server_url', window.KITTYCOLLAB_SERVER_URL);
                }
                window.location.href = '/rooms';
            } catch (error) {
                console.error('Login error:', error);
                btn.innerHTML = originalText;
                btn.disabled = false;
                alert('Unable to continue. Please try again.');
            }
        };
    </script>
</body>

</html>
