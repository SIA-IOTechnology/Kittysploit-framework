[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kittysploit"
version = "1.1.3"
description = "KittySploit - A modular penetration testing framework"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
    { name = "KittySploit Team" }
]
keywords = ["security", "pentest", "framework", "exploit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "requests-ntlm>=1.2.0",
    "msgpack>=1.0.5",
    "colorama>=0.4.4",
    "cryptography>=3.4.8",
    "pycryptodome>=3.18.0",
    "websockets>=10.0",
    "aiohttp>=3.8.0",
    "aiomqtt>=1.0.0",
    "paho-mqtt>=1.6.0",
    "dnslib>=0.9.0",
    "prompt_toolkit>=3.0.0",
    "langgraph>=1.0.0,<2.0; python_version >= '3.10'",
    "flask>=2.0.0",
    "waitress>=3.0.0",
    "flask-cors>=3.0.10",
    "flask-socketio>=5.3.0",
    "fastapi>=0.100.0",
    "python-multipart>=0.0.6",
    "paramiko>=2.9.0",
    "scapy>=2.4.5",
    "netaddr>=0.8.0",
    "xmltodict>=0.13.0",
    "websocket-client>=1.5.0",
    "psutil>=5.8.0",
    "pyngrok>=5.0.0",
    "bleak>=0.20.0",
    "nava>=0.5",
    "six>=1.16.0",
    "docker>=6.0.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=4.5.0",
    "ldap3>=2.9.0",
    "pyasn1>=0.4.8",
    "pymongo>=4.0.0",
    "elasticsearch>=8.0.0",
    "pymssql>=2.2.0",
    "pysnmp>=4.4.12",
    "pysmb>=1.2.0",
    "toml>=0.10.2",
    "tomli>=2.0.0; python_version < '3.11'",
    "pyyaml>=6.0",
    "bcrypt==5.0.0",
    "pyserial>=3.5",
    "pychromecast>=13.0.0",
    "python-can>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "uvicorn>=0.22.0",
    "mitmproxy>=9.0.0",
    "boto3>=1.26.0",
    "pure-python-adb>=0.3.0.dev0",
    "pyftpdlib>=1.5.7",
    "pyjwt>=2.6.0",
    "Pillow>=9.5.0",
    "mcp>=1.0.0",
    "python-whois>=0.8.0",
    "dnspython>=2.3.0",
    "reportlab>=3.6.13",
    "pypdf>=5.0.0",
    "capstone>=5.0.0",
    "yara-python>=4.5.0",
    "jsonschema>=4.0.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
# Install Windows extras: pip install kittysploit[windows]
windows = [
    "pywin32>=301",
    "winshell>=0.6",
    "pyreadline3>=3.4.0",
]
# Developer tooling: pip install -e ".[dev]"
dev = [
    "pytest>=7.0",
]

[project.scripts]
kittysploit = "kittysploit.__main__:main"
kittyrelay = "lib.relay.kittyrelay:main"
kittymcp-server = "kittymcp_server:main"
kittymcp-client = "kittymcp_client:main"

[tool.setuptools]
py-modules = ["kittymcp_client", "kittymcp_server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "interfaces*", "modules*", "lib*", "plugins*", "kittysploit*", "data*", "docs*"]
exclude = ["examples*", "scripts*", "install*", "tests*", "venv*", "apps*"]

[tool.setuptools.package-data]
"core.schemas" = ["json/v1/*.schema.json", "README.md"]
"core.workflows" = ["library/*.yaml", "library/*.yml", "library/*.json"]
"core" = [
    "browser_static/libs/*.js",
    "browser_static/icons/**/*.svg",
    "browser_static/icons/**/.gitkeep",
]
"data" = ["**/*.json", "**/*.txt", "**/*.wav", "**/*.py"]
"data.syscall" = ["*.json"]
"interfaces.static" = ["img/**/*"]
"docs" = ["screenshots/*", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --tb=short"
markers = [
    "slow: loads every discovered module (can take ~2 minutes)",
]
